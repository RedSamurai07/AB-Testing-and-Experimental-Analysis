name: Analysis Service CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov # Ensures the coverage framework plugin is installed
        
    - name: Run tests with Coverage
      run: |
        # Appended flags to generate the coverage report (coverage.xml) alongside your JUnit XML
        python3 -m pytest tests/test_analyzer.py --junitxml=test-results.xml --cov=./ --cov-report=xml
        
    - name: Upload Coverage Results to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # Uses the token configured in your GitHub Secrets
        file: ./coverage.xml
        fail_ci_if_error: true
        
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results.xml